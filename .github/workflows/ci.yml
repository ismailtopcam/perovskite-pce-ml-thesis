# Surekli entegrasyon: her push/PR'da birim testler kosulur.
# Testler ham veri gerektirmez (sentetik veriyle calisir) ve hafif bagimlilik
# kumesiyle (boosting kutuphaneleri olmadan) kosulur; Python 3.10 matrisi,
# eski bir Python surumuyle uyumlulugu dolayli sinar; 3.14, tezde raporlanan
# kosularin uretildigi surumdur.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test bagimliliklarini kur (hafif kume; boosting kutuphaneleri testlerde kullanilmaz)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy pyyaml pytest
      - name: Birim testleri calistir
        run: python -m pytest -q
